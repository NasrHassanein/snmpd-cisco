###############################################################################
# snmpd.conf — Cisco IOS Router Simulation (ISR 4331)
#
# This configuration makes the Linux snmpd agent respond to SNMP queries
# as if it were a Cisco ISR 4331 running IOS XE 16.6.2.
###############################################################################

# ─── Listening address ───────────────────────────────────────────────────────
agentAddress udp:161

# ─── Community strings (SNMPv1/v2c) ─────────────────────────────────────────
rocommunity  public
# rocommunity6 public   # uncomment for IPv6

# ─── SNMPv3 users (MIMIC Viewer defaults) ────────────────────────────────────
# createUser entries are written to /var/lib/snmp/snmpd.conf by entrypoint.sh
# Auth/priv password for all users: 1234567890abcdef
#
# Users without context (access default context "")
rouser user1 noauth
rouser user2 auth
rouser user3 auth
rouser user4 priv
rouser user5 priv
rouser user6 priv
rouser user7 priv
#
# Users with named contexts
rouser user11 noauth .1 context11
rouser user12 auth   .1 context12
rouser user13 auth   .1 context13
rouser user14 priv   .1 context14
rouser user15 priv   .1 context15

# ─── System identity overrides ───────────────────────────────────────────────
# sysDescr.0 — matches real Cisco IOS XE output
override .1.3.6.1.2.1.1.1.0 octet_str "Cisco IOS Software [Everest], ISR Software (X86_64_LINUX_IOSD-UNIVERSALK9-M), Version 16.6.2, RELEASE SOFTWARE (fc2)\x0aTechnical Support: http://www.cisco.com/techsupport\x0aCopyright (c) 1986-2017 by Cisco Systems, Inc.\x0aCompiled Wed 01-Nov-17 07:24 by mcpre"

# sysObjectID.0 — ciscoISR4331 (.1.3.6.1.4.1.9.1.2458)
override .1.3.6.1.2.1.1.2.0 object_id .1.3.6.1.4.1.9.1.2458

# sysContact.0
override .1.3.6.1.2.1.1.4.0 octet_str "noc@example.com"

# sysName.0
override .1.3.6.1.2.1.1.5.0 octet_str "router-gw-01.example.com"

# sysLocation.0
override .1.3.6.1.2.1.1.6.0 octet_str "DC1 Row3 Rack12"

# sysServices.0 — 78 = L2+L3+L7 (typical Cisco router)
override .1.3.6.1.2.1.1.7.0 integer 78

# ─── IF-MIB interface description overrides ──────────────────────────────────
# Make Linux interfaces look like Cisco interfaces.
# Index 1 = lo → Loopback0, Index 2 = eth0 → GigabitEthernet0/0/0
override .1.3.6.1.2.1.2.2.1.2.1 octet_str "Loopback0"
override .1.3.6.1.2.1.2.2.1.2.2 octet_str "GigabitEthernet0/0/0"
# ifAlias (high-capacity)
override .1.3.6.1.2.1.31.1.1.1.18.1 octet_str "Loopback0"
override .1.3.6.1.2.1.31.1.1.1.18.2 octet_str "WAN uplink"

# ─── pass_persist: Cisco proprietary OID subtrees ───────────────────────────
# Serves OLD-CISCO, CISCO-ENVMON, CISCO-PROCESS, CISCO-MEMORY-POOL, etc.
pass_persist .1.3.6.1.4.1.9  /usr/local/bin/cisco_fake_agent.py

# Serves ENTITY-MIB entPhysicalTable (chassis/module/port inventory)
pass_persist .1.3.6.1.2.1.47 /usr/local/bin/cisco_fake_agent.py

# ─── AgentX (disabled, not needed for standalone simulation) ─────────────────
# master agentx

# ─── Logging ─────────────────────────────────────────────────────────────────
# Log to stderr so Docker can capture it
[snmpd]
logOption f /dev/stderr
